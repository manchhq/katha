[package]
name = "katha-rusqlite"
version = { workspace = true }
edition = { workspace = true }
rust-version = "1.94"
license = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
description = "Rusqlite event store for katha with optional managed PowerSync support"
readme = "README.md"

[features]
default = []
powersync = ["dep:powersync", "dep:futures-lite"]

[dependencies]
katha = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
rusqlite = { version = "0.39", features = ["bundled"] }
powersync = { version = "0.1.1", optional = true }
futures-lite = { version = "2", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
powersync = { version = "0.1.1", features = ["tokio"] }

[package.metadata.docs.rs]
all-features = true

[package.metadata.release]
tag = false
